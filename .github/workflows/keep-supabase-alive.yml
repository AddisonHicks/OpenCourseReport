# Keep the Supabase free-tier project from pausing after ~7 days of inactivity.
# Requires repo secrets: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (Project Settings → API Keys).
#
# Note: GitHub may disable scheduled workflows after 60 days with no repo activity;
# push a commit or run this manually from the Actions tab if that happens.

name: Keep Supabase Alive

on:
  schedule:
    # Monday and Thursday 12:00 UTC — safely under the 7-day pause window
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "Missing secrets: set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in repo Settings → Secrets and variables → Actions"
            exit 1
          fi

          # Strip trailing slash; hit a public-readable table so the publishable key is enough
          BASE="${SUPABASE_URL%/}"
          HTTP_CODE=$(curl -sS -o /tmp/supabase-ping-body.txt -w "%{http_code}" \
            "${BASE}/rest/v1/courses?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json")

          echo "HTTP ${HTTP_CODE}"
          head -c 500 /tmp/supabase-ping-body.txt || true
          echo

          case "${HTTP_CODE}" in
            2??) echo "Supabase keep-alive ping succeeded." ;;
            *)
              echo "Supabase keep-alive ping failed."
              exit 1
              ;;
          esac
